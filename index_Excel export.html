<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Men's Doubles — SBL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --ink:#0E2A25; --muted:#587068; --line:#D3DED8;
  --court:#14614F; --on-court:#F2FAF6; --chip:#E3EFE9; --dim:#9BB0A7; --focus:#1B7FE0; --link:#14614F;
  --brand:#1E8E4E; --spoc:#9C36B5; --spoc-soft:#F5E8FA; --d1:#E8590C; --d1-soft:#FFEDE3; --d2:#1971C2; --d2-soft:#E5F1FC; --gold:#F7D64A;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1614; --surface:#122320; --ink:#E5F0EC; --muted:#8BA69D; --line:#23403A;
    --court:#0F4F41; --on-court:#F2FAF6; --chip:#1B3530; --dim:#4B665D; --focus:#6DB4FF; --link:#6FD1B4;
    --spoc-soft:#2A1633; --d1-soft:#33190C; --d2-soft:#0F2338; --gold:#C9A92B;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1614; --surface:#122320; --ink:#E5F0EC; --muted:#8BA69D; --line:#23403A;
  --court:#0F4F41; --on-court:#F2FAF6; --chip:#1B3530; --dim:#4B665D; --focus:#6DB4FF; --link:#6FD1B4;
  --spoc-soft:#2A1633; --d1-soft:#33190C; --d2-soft:#0F2338; --gold:#C9A92B;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.topbar{background:var(--brand);color:#fff}
.topin{max-width:1360px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand .logo{width:48px;height:44px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.brand .logo img{max-width:100%;max-height:100%}
.brand b{display:block;font:800 28px/.95 var(--display);letter-spacing:.01em}
.brand small{display:block;font-size:12px;opacity:.9;letter-spacing:.02em}
.search{margin-left:auto;flex:1 1 280px;max-width:460px;position:relative}
.search input{width:100%;border:0;border-radius:999px;padding:9px 42px 9px 16px;font-size:16px;background:#fff;color:#0E2A25}
.search input::placeholder{color:#6B8078}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:#E3EFE9;color:#0E2A25;font-size:18px;line-height:1;cursor:pointer;display:none}
.search.has button{display:block}
.venue{display:inline-flex;align-items:center;gap:5px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.95;white-space:nowrap;padding:4px 0}
.venue:hover{text-decoration:underline;opacity:1}
.venue svg{flex:none}

.tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabsin{max-width:1360px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:thin}
.tab{flex:none;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab .n{font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{background:var(--court);border-color:var(--court);color:var(--on-court)}
.tab[aria-current="page"] .n{color:var(--on-court);opacity:.85}
.tab.home{gap:7px}

main{max-width:1360px;margin:0 auto;padding:14px 14px 60px}
h1.pg{margin:0;font:800 clamp(34px,6vw,52px)/1 var(--display);letter-spacing:.005em}
.sub{margin:6px 0 0;color:var(--muted)}
.daychips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dchip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:#fff}
.dchip.d1{background:var(--d1)}.dchip.d2{background:var(--d2)}
.sec{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec h2{margin:0;font:800 30px/1 var(--display)}
.sec span{color:var(--muted);font-size:13px}
.sec .sp{flex:1}

/* home: one-screen layout */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hm{display:grid;grid-template-columns:minmax(400px,1fr) 1.45fr;gap:16px;align-items:start}
.seg.hseg{display:none}
.stack{display:grid;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day header{padding:7px 14px;color:#fff;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.day.d1 header{background:var(--d1)}.day.d2 header{background:var(--d2)}
.day header b{font:800 26px/1 var(--display)}
.day header span{font-size:13px;opacity:.95;font-weight:500}
.day ol{list-style:none;margin:0;padding:2px 6px 4px}
.day li{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:6px 8px;min-height:34px}
.day li + li{border-top:1px solid var(--line)}
.tm{font:800 22px/1 var(--display);white-space:nowrap}
.day.d1 .tm{color:var(--d1)}.day.d2 .tm{color:var(--d2)}
:root[data-theme="dark"] .day .tm{filter:brightness(1.35)}
.cn{font-weight:600;line-height:1.25}
.cn small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.go{color:var(--link);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.go:hover{text-decoration:underline}

.spc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.spc header{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--spoc);color:#fff;flex-wrap:wrap}
.spc header b{font:800 26px/1 var(--display)}
.spc header span{font-size:13px;opacity:.95;flex:1}
.segd{display:flex;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.2)}
.segd button{border:0;background:transparent;color:#fff;padding:7px 12px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.segd button[aria-pressed="true"]{background:#fff;color:var(--spoc)}
.spc .btn{min-height:34px;padding:5px 12px;font-size:13.5px;background:#fff;color:#3A0F47;border-color:#fff}
.spc .btn.pri{background:var(--gold);border-color:var(--gold);color:#3B2F00}
.spc .btn.plain{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.tw{overflow-x:auto}
.st{width:100%;border-collapse:collapse;min-width:480px;table-layout:fixed}.st th:first-child{width:78px}
.st th{background:var(--spoc-soft);text-align:left;font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line)}
.st td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;height:38px;font-size:14px}
.st tr:last-child td{border-bottom:0}
.st tbody tr:nth-child(even) td{background:var(--bg)}
.st td.c{width:78px;padding:4px 8px}
.cno{display:inline-block;background:var(--gold);color:#3B2F00;border-radius:8px;padding:3px 10px 2px;line-height:1;text-align:center;min-width:56px}
.cno small{display:block;font-size:9px;font-weight:700;letter-spacing:.05em}
.cno b{display:block;font:800 22px/1 var(--display)}
.nm{font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.ph{display:block;color:var(--link);font-weight:600;font-size:12.5px;text-decoration:none}
.none{color:var(--dim)}
.st input{width:100%;min-width:100px;border:1.5px dashed var(--dim);border-radius:8px;background:var(--surface);padding:5px 8px;min-height:32px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.btn.pri{background:var(--court);border-color:var(--court);color:var(--on-court)}
.hintx{color:var(--muted);font-size:12.5px;padding:6px 12px;background:var(--spoc-soft)}

/* category cards on home */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cc{display:block;text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.cc:hover{border-color:var(--court)}
.cc b{display:block;font:800 26px/1 var(--display)}
.cc span{color:var(--muted);font-size:13px}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 6px}
.row2 select{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--court);color:var(--on-court)}
.row2 .right{margin-left:auto}
.count{color:var(--muted);font-size:13px;margin:6px 2px 10px}

.grp{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px}
.grp h2{margin:0;font:800 26px/1 var(--display);letter-spacing:.01em}
.grp span{color:var(--muted);font-size:13px}
.grp .cat{color:var(--link);font-weight:700;font-size:14px}

.m{display:grid;grid-template-columns:58px minmax(120px,1fr) 410px 270px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--d1);border-radius:12px;padding:10px 12px;margin:0 0 7px}
.m.day2{border-left-color:var(--d2)}
.id{font:600 20px/1 var(--display);color:var(--muted)}
.pl .p{font-weight:600;overflow-wrap:anywhere}
.tbd{color:var(--dim);font-weight:400;font-style:italic}
.pl .v{font-size:12px;color:var(--muted);margin:1px 0}
.seed{display:inline-block;min-width:22px;text-align:center;background:var(--chip);color:var(--muted);border-radius:6px;font-size:12px;font-weight:600;margin-right:6px;padding:0 4px}
.when{font-size:13px;color:var(--muted);line-height:1.3}
.when b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.sp{line-height:1.3;color:var(--ink);min-width:0}.sp small{display:block;color:var(--spoc);font-weight:700;font-size:12px;margin-bottom:2px}.sp b{display:block;white-space:nowrap;font-weight:800;font-size:17px;line-height:1.25}.sp b:before{content:'\2022\00a0';color:var(--spoc)}.sp i{font-style:normal;color:var(--dim);font-size:14px}.sp .ph{display:inline;font-size:15px}
.sp:not(:empty),.gd{border:1.5px solid var(--spoc);border-radius:10px;padding:6px 10px}
.gd{border-color:var(--court);display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:2px;align-items:center;min-width:0}
.gd>small{grid-column:1/-1;display:block;color:var(--spoc);font-weight:700;font-size:12px}
:root[data-theme="dark"] .gd{border-color:#3FB597}
.court{justify-self:end;text-align:center;border:2px solid var(--court);border-radius:10px;padding:3px 0 2px;width:64px;color:var(--court);background:transparent}
:root[data-theme="dark"] .court{color:#6FD1B4;border-color:#3FB597}
.court small{display:block;font-size:11px;font-weight:600;line-height:1}
.court b{display:block;font:800 30px/1 var(--display)}
.court.na{border-color:var(--line);color:var(--dim);border-style:dashed}
.court.na b{font-size:22px;padding:4px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}

.bracket{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;max-height:76vh;position:relative;touch-action:pan-x pan-y pinch-zoom}
.bztool{display:flex;align-items:center;gap:8px;margin:0 2px 10px;flex-wrap:wrap}
.bzbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);touch-action:manipulation}
.bzbtn:active{background:var(--chip)}
.bzlbl{font-weight:700;font-size:13px;min-width:46px;text-align:center;color:var(--muted)}
.bzfit{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);touch-action:manipulation}
.bzfit:active{background:var(--chip)}
.bh{position:sticky;top:0;z-index:3;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.bh div{flex:none;padding:10px 12px;font:800 20px/1 var(--display)}
.bh small{font:400 12px var(--body);color:var(--muted);margin-left:6px}
.bb{position:relative}
.bc{position:absolute;background:var(--bg);border:1.5px solid var(--line);border-left:4px solid var(--d1);border-radius:8px;padding:2px 8px;overflow:hidden;font-size:12.5px;line-height:1.25}
.bc.day2{border-left-color:var(--d2)}
.bc .mt{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.bc .mt b{color:var(--link)}
.bc .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bc.dim{opacity:.28}
.bconn{fill:none;stroke:var(--dim);stroke-width:1.75}
.bconn-dim{opacity:.28}
.bnote{color:var(--muted);font-size:13px;margin:0 2px 8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
footer{max-width:1360px;margin:0 auto;padding:0 14px 40px;color:var(--muted);font-size:13px}
.ftools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink)}
.ftools b{font-weight:700}
.ftools .btn.pri{background:var(--court);border-color:var(--court);color:var(--on-court)}
.lunch{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#FFF4CC;color:#4A3600;border-top:1px solid #EAD68A;font-size:14px}
.lunch b{font-weight:700}.lunch span{font:800 20px/1 var(--display);margin-left:auto;white-space:nowrap}
:root[data-theme="dark"] .lunch{background:#3A2F0A;color:#F3DFA0;border-top-color:#5B4A12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lunch{background:#3A2F0A;color:#F3DFA0;border-top-color:#5B4A12}}


/* results + organiser mode */
.pl .p.rs,.bc .p.rs{display:flex;align-items:center;gap:8px}
.rs .pn{flex:1;min-width:0}
.pl .p.lose{color:var(--muted);font-weight:500}
.bc .p.lose{color:var(--muted);font-weight:500}
.bc .rs .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{color:var(--link);font-weight:800;flex:none}
.sc{display:inline-flex;gap:4px;flex:none;font:700 16px/1 var(--display);letter-spacing:.02em}
.sc i{font-style:normal;min-width:24px;text-align:center;padding:3px 4px 2px;border-radius:6px;background:var(--chip);color:var(--muted)}
.sc i.w{background:var(--court);color:var(--on-court)}
.bc .sc{gap:3px;font-size:12px}
.bc .sc i{min-width:17px;padding:0 3px;line-height:1.3;border-radius:4px}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px;margin-top:5px}
.bc.ed{cursor:pointer}
.bc.ed:hover{border-color:var(--court)}
.champ{margin:8px 0 0;font-weight:600}
.ohint{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--spoc-soft);font-size:13.5px}
.hnt{color:var(--muted);font-size:13px}
.obar{position:sticky;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.obar:empty{display:none}
.obar .st2{flex:1;min-width:180px;font-size:14px}
.obar .btn{min-height:38px;padding:6px 14px;color:var(--ink)}
.obar .btn.pri{background:var(--gold);border-color:var(--gold);color:#3B2F00}
.obar .btn.plain{background:transparent;color:var(--bg);border-color:currentColor}
.ov{position:fixed;inset:0;z-index:100;background:rgba(6,20,17,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.mdl{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:100%;max-width:420px;margin:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mdl h2{margin:0 0 2px;font:800 22px/1.05 var(--display)}
.mdl .ms{color:var(--muted);font-size:12px;margin:2px 0 6px}
.mdl .lbl{display:block;font-weight:700;font-size:12px;margin:10px 0 4px}
.mdl input[type=password],.mdl input[type=text],.mdl select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;min-height:36px;font-size:14px}
.wsel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wsel button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-weight:600;cursor:pointer;text-align:left;min-height:38px;overflow-wrap:anywhere;font-size:13px}
.wsel button[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--on-court)}
.wsel button:disabled{opacity:.45;cursor:not-allowed}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,50px);gap:5px;align-items:center}
.sgrid.one{grid-template-columns:minmax(0,1fr) 72px}
.sgrid .h{font-size:11px;color:var(--muted);text-align:center}
.sgrid .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrid input{width:100%;text-align:center;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 2px;min-height:36px;font-weight:700;font-size:15px}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mact .sp{flex:1}
.mdl .btn{min-height:34px;padding:6px 12px;font-size:13.5px}
.mdl .seg button{padding:6px 10px;min-height:34px;font-size:13px}
.err{color:#C92A2A;font-size:13px;margin-top:8px;min-height:18px;font-weight:600}
:root[data-theme="dark"] .err{color:#FF8787}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF8787}}


.m[data-goto]{cursor:pointer}
.m[data-goto]:hover{border-color:var(--court)}
.vb{display:block;margin-top:4px;padding:0;border:0;background:none;color:var(--link);font-weight:600;font-size:13px;cursor:pointer;text-align:left}
.vb:hover{text-decoration:underline}
.bc.hit{border-color:var(--court);box-shadow:0 0 0 2px var(--court)}
.bc.focus{z-index:2;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--court)}
@media (prefers-reduced-motion:no-preference){.bc.focus{animation:pulse 1.2s ease-out 2}}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--court)}50%{box-shadow:0 0 0 6px var(--gold),0 0 0 9px var(--court)}100%{box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--court)}}
@media (max-width:900px){
  .m{grid-template-columns:50px 1fr auto;grid-template-areas:"id pl gd" "sp sp sp";row-gap:8px}
  .id{grid-area:id}.pl{grid-area:pl}.sp{grid-area:sp}.gd{grid-area:gd}

<script>

function compact(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'')}

    if(m.round==='Finals')m.round='Final';

/* ---------- bracket links + winner advancement ---------- */
function isEmp(x){var s=x==null?'':String(x).trim();return !s||s.toUpperCase()==='TBD'||/^winner of match/i.test(s)}

  });

  cats.forEach(function(c){

function mins(t){var m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t);if(!m)return 0;var h=+m[1]%12;if(m[3].toUpperCase()==='PM')h+=12;return h*60+ +m[2]}
function catLinks(text){
  var out=[];
  cats.forEach(function(c,i){
    var n=c.name.replace("Master's","Master's");
    if(text.indexOf(n)>-1)out.push(i);
  });
  if(/Women's Singles and Doubles/.test(text)){var wd=cats.findIndex(function(c){return c.name==="Women's Doubles"});if(wd>-1&&out.indexOf(wd)<0)out.push(wd)}
  if(/^Team Events/.test(text)&&out.length===0){out.push(cats.length-1)}
  return out;
}
function dayCard(cls,name,date,rows){
  var sorted=rows.slice().sort(function(a,b){return mins(a.t)-mins(b.t)});
  return '<section class="day '+cls+'"><header><b>'+name+'</b><span>'+date+'</span></header><ol>'+sorted.map(function(r){
    var parts=r.c.split(' — ');var links=catLinks(r.c);
    return '<li><div class="tm">'+esc(r.t)+'</div><div class="cn">'+esc(parts[0])+(parts[1]?'<small>'+esc(parts[1])+'</small>':'')+'</div>'+
      (links.length?'<a class="go" href="#/'+cats[links[0]].slug+'" aria-label="View draw for '+esc(parts[0])+'">Draw ›</a>':'<span></span>')+'</li>';
  }).join('')+'</ol><div class="lunch">🍽️ <b>Lunch served</b><span>'+esc(SP.lunch||'12:00 PM – 2:00 PM')+'</span></div></section>';
}
function linkPhone(v){
  var m=/(\+?\d[\d\s-]{7,}\d)/.exec(v);
  if(!m)return {name:v.trim(),phone:''};
  return {name:v.replace(m[1],'').replace(/[,;:\-–]\s*$/,'').trim(),phone:m[1].trim()};
}

function idb(cb){try{var rq=indexedDB.open('sbl2026',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('h')};rq.onsuccess=function(){cb(rq.result)};rq.onerror=function(){cb(null)}}catch(e){cb(null)}}
function getH(){return new Promise(function(res){idb(function(db){if(!db)return res(null);try{var q=db.transaction('h').objectStore('h').get('fh');q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})})}
function putH(h){idb(function(db){if(!db)return;try{db.transaction('h','readwrite').objectStore('h').put(h,'fh')}catch(e){}})}
async function writeFile(html){
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{
      var rs=await fetch('__save',{method:'POST',headers:{'Content-Type':'text/html','X-SBL-Auth':PWH},body:html,cache:'no-store'});
      if(rs.ok){var jj=await rs.json();return (jj&&jj.name?jj.name:'the shared file')+' (same place)'}
    }catch(e){}
  }
  if(!window.showSaveFilePicker)throw {name:'NoFS'};
  var h=fh||await getH();
  if(h){try{var pm=await h.queryPermission({mode:'readwrite'});if(pm!=='granted')pm=await h.requestPermission({mode:'readwrite'});if(pm!=='granted')h=null}catch(e){h=null}}
  if(!h)h=await window.showSaveFilePicker({suggestedName:'SBL2026_Fixtures.html',types:[{description:'HTML file',accept:{'text/html':['.html']}}]});
  var w=await h.createWritable();await w.write(new Blob([html],{type:'text/html'}));await w.close();
  fh=h;putH(h);return h.name;
}

/* ---------- organiser: export Day-2 fixtures to Excel (per category, per court) ---------- */
var EXPORT_SLUGS={'men-singles':'MensSingles','women-singles':'WomensSingles','men-doubles':'MensDoubles','women-doubles':'WomensDoubles','mixed-doubles':'MixedDoubles'};
var EXPORT_SKIP=['masters-doubles','team-events'];
function shortRound(r){return r.replace('Round ','R').replace('Semifinals','SF').replace('Final','F')}
function exportPlayerLabel(m,s,srcMap){
  var p=m['e'+s];
  if(!isEmp(p))return String(p).trim();
  var src=srcMap[m.ci+'|'+m.id+'|'+s];
  if(src)return 'Winner of '+shortRound(src.round)+' Match '+src.id;
  return 'TBD';
}
function buildCourtSheet(cat,groupLabel,matches,srcMap,dayNum){
  var byRound={};
  matches.forEach(function(m){(byRound[m.ri]=byRound[m.ri]||[]).push(m)});
  var ris=Object.keys(byRound).map(Number).sort(function(a,b){return a-b});
  var firstR=cat.rounds[ris[0]],lastR=cat.rounds[ris[ris.length-1]];
  var aoa=[];
  aoa.push([groupLabel+' — Day '+dayNum+' — '+cat.name+' — '+matches.length+' Match'+(matches.length===1?'':'es')+(firstR===lastR?' ('+firstR+')':' ('+firstR+' to '+lastR+')'),'','','',''])
  aoa.push(['Round','Match #','Player/Team A','Player/Team B','Winner']);
  var merges=[{s:{r:0,c:0},e:{r:0,c:4}}];
  ris.forEach(function(ri){
    var rms=byRound[ri].slice().sort(function(a,b){return a.r-b.r});
    var bannerRow=aoa.length;
    aoa.push([cat.rounds[ri]+' — '+rms.length+' match'+(rms.length===1?'':'es')+' on '+groupLabel,'','','','']);
    merges.push({s:{r:bannerRow,c:0},e:{r:bannerRow,c:4}});
    rms.forEach(function(m){
      var winner='';
      if(m.res&&m.res.w){
        winner=exportPlayerLabel(m,m.res.w,srcMap);
        if(m.res.st)winner+=' ('+(m.res.st==='WO'?'WO':'Retired')+')';
      }
      aoa.push([cat.rounds[ri],m.id,exportPlayerLabel(m,1,srcMap),exportPlayerLabel(m,2,srcMap),winner]);
    });
  });
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=merges;
  ws['!cols']=[{wch:12},{wch:9},{wch:32},{wch:32},{wch:14}];
  return ws;
}
function exportByDay(dayNum){
  if(typeof XLSX==='undefined'||typeof JSZip==='undefined'){alert('Export library failed to load — check your internet connection and try again.');return}
  var zip=new JSZip(),any=false,dstr=String(dayNum);
  cats.forEach(function(cat,ci){
    if(EXPORT_SKIP.indexOf(cat.slug)>-1)return;
    var short=EXPORT_SLUGS[cat.slug];if(!short)return;
    var dm=cat.matches.filter(function(m){return m.day===dstr});
    if(!dm.length)return;
    var srcMap={};
    cat.matches.forEach(function(m){if(m.nx)srcMap[m.ci+'|'+m.nx.id+'|'+m.ns]=m});
    var byCourt={};
    dm.forEach(function(m){var k=m.cn===null?'TBD':String(m.cn);(byCourt[k]=byCourt[k]||[]).push(m)});
    var courtKeys=Object.keys(byCourt).filter(function(k){return k!=='TBD'}).sort(function(a,b){return (+a)-(+b)});
    if(byCourt.TBD)courtKeys.push('TBD');
    var wb=XLSX.utils.book_new();
    courtKeys.forEach(function(k){
      var groupLabel=k==='TBD'?'Court TBD':'Court '+k;
      var ws=buildCourtSheet(cat,groupLabel,byCourt[k],srcMap,dayNum);
      XLSX.utils.book_append_sheet(wb,ws,groupLabel.slice(0,31));
    });
    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    zip.file('SBL2k26_'+short+'_Day'+dayNum+'_Fixture.xlsx',buf);
    any=true;
  });
  if(!any){alert('No Day-'+dayNum+' matches found to export.');return}
  zip.generateAsync({type:'blob'}).then(function(blob){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SBL2k26_Day'+dayNum+'_Fixture_Exports.zip';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
  });
}
function exportDay1(){exportByDay(1)}
function exportDay2(){exportByDay(2)}

/* ---------- organiser: export full draw sheets as an Excel bracket tree (one sheet per category) ---------- */
function excelSheetName(name,used){
  var s=String(name).replace(/[\\\/\?\*\[\]:]/g,'-').trim();
  if(!s)s='Sheet';
  if(s.length>31)s=s.slice(0,31);
  var base=s,n=2;
  while(used[s]){s=(base.slice(0,31-String(n).length-1)+' '+n);n++}
  used[s]=true;
  return s;
}
var COURT_PALETTE=['F6C9A0','FDE39B','B9E3C6','A9D6E5','D7BDE2','F7B2B7','BFD8B8','F9E0AE','C9CBFF','FFD6A5','CDEAC0','AED9E0','E7C6FF','FFADAD'];
var TBD_FILL='E5E5E5',BAND_FILL='2F6FB5';
function buildCourtColorMap(){
  var courts=[];
  cats.forEach(function(c){c.matches.forEach(function(m){if(m.cn!==null&&courts.indexOf(m.cn)<0)courts.push(m.cn)})});
  courts.sort(function(a,b){return a-b});
  var map={};
  courts.forEach(function(cn,i){map[cn]=COURT_PALETTE[i%COURT_PALETTE.length]});
  return map;
}
function fill(hex){return {type:'pattern',pattern:'solid',fgColor:{argb:'FF'+hex}}}
function thinBorder(){var b={style:'thin',color:{argb:'FFBFBFBF'}};return {top:b,left:b,bottom:b,right:b}}
function buildBracketTreeSheet(wb,cat,ci,courtColor){
  var srcMap={};
  cat.matches.forEach(function(m){if(m.nx)srcMap[ci+'|'+m.nx.id+'|'+m.ns]=m});
  var minr=1e9,maxr=0;
  cat.matches.forEach(function(m){if(m.r>maxr)maxr=m.r;if(m.r<minr)minr=m.r});
  var top=minr-1;
  var GAP_W=1,HEAD=2;
  var ROUND_W=3;
  var nRounds=cat.rounds.length;
  var totalCols=nRounds*ROUND_W+(nRounds-1)*GAP_W;
  var totalRows=HEAD+Math.max(0,maxr-top)+3;
  var ws=wb.addWorksheet(excelSheetName(cat.name,wb.__used||(wb.__used={})));
  ws.properties.defaultRowHeight=30;
  var cols=[];
  for(var ci2=0;ci2<nRounds;ci2++){
    cols.push({width:9});cols.push({width:30});cols.push({width:18});
    if(ci2<nRounds-1)cols.push({width:3});
  }
  ws.columns=cols;
  var titleCell=ws.getCell(1,1);
  titleCell.value=cat.name+' — Bracket Tree (colour = court)';
  titleCell.font={bold:true,size:14,color:{argb:'FF14261F'}};
  ws.mergeCells(1,1,1,Math.max(1,totalCols));
  var byRound={};
  cat.matches.forEach(function(m){(byRound[m.ri]=byRound[m.ri]||[]).push(m)});
  for(var ri=0;ri<nRounds;ri++){
    var colStart=ri*(ROUND_W+GAP_W)+1;
    var colId=colStart,colLabel=colStart+1,colInfo=colStart+2;
    var rms=(byRound[ri]||[]);
    var bandCell=ws.getCell(2,colId);
    bandCell.value=cat.rounds[ri]+' — '+rms.length+' match'+(rms.length===1?'':'es');
    bandCell.font={bold:true,color:{argb:'FFFFFFFF'}};
    bandCell.alignment={horizontal:'center',vertical:'middle'};
    bandCell.fill=fill(BAND_FILL);
    ws.mergeCells(2,colId,2,colLabel<colInfo?colInfo:colLabel);
    rms.forEach(function(m){
      var rowIdx=HEAD+Math.max(0,m.r-top)+1;
      var rowEnd=rowIdx+1;
      var courtLbl=m.cn===null?'Ct TBD':'Ct '+m.cn;
      var idCell=ws.getCell(rowIdx,colId);
      idCell.value='#'+m.id+'\n'+courtLbl+(m.sess?' · '+m.sess:'');
      idCell.font={bold:true,size:11};
      idCell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
      idCell.border=thinBorder();
      ws.mergeCells(rowIdx,colId,rowEnd,colId);
      function runFont(s){
        var win=m.res&&m.res.w===s,lose=m.res&&m.res.w&&m.res.w!==s;
        return {bold:!!win,color:{argb:win?'FF1B7A3D':(lose?'FF8A8A8A':'FF1A1A1A')}};
      }
      var p1txt=(m.res&&m.res.w===1?'✓ ':'')+exportPlayerLabel(m,1,srcMap)+'  VS';
      var p2txt=(m.res&&m.res.w===2?'✓ ':'')+exportPlayerLabel(m,2,srcMap);
      var lblCell=ws.getCell(rowIdx,colLabel);
      lblCell.value={richText:[{font:runFont(1),text:p1txt},{font:{},text:'\n'},{font:runFont(2),text:p2txt}]};
      lblCell.alignment={horizontal:'left',vertical:'middle',wrapText:true};
      lblCell.border=thinBorder();
      ws.mergeCells(rowIdx,colLabel,rowEnd,colLabel);
      var dayLbl=m.day?('DAY-'+m.day+(m.sess?' · '+m.sess:'')):'';
      var dayInfo=(dayLbl?dayLbl+' ':'')+(m.date||'');
      var infoCell=ws.getCell(rowIdx,colInfo);
      infoCell.value=dayInfo+'\nCourt '+(m.cn===null?'TBD':m.cn);
      infoCell.font={bold:true,size:10.5,color:{argb:'FF1A1A1A'}};
      infoCell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
      infoCell.fill=fill(m.cn===null?TBD_FILL:courtColor[m.cn]);
      infoCell.border=thinBorder();
      ws.mergeCells(rowIdx,colInfo,rowEnd,colInfo);
    });
  }
  ws.views=[{state:'frozen',ySplit:2}];
  return ws;
}
function exportBracketTrees(){
  if(typeof ExcelJS==='undefined'){alert('Export library failed to load — check your internet connection and try again.');return}
  var wb=new ExcelJS.Workbook();
  wb.creator='SBL 2026';
  var courtColor=buildCourtColorMap();
  var any=false;
  cats.forEach(function(cat,ci){
    if(!cat.matches.length)return;
    buildBracketTreeSheet(wb,cat,ci,courtColor);
    any=true;
  });
  if(!any){alert('No categories found to export.');return}

  var a=b.getAttribute('data-bz'),cur=S.bz||1;
  if(a==='in')S.bz=Math.min(1.5,Math.round((cur+0.15)*100)/100);
  else if(a==='out')S.bz=Math.max(0.3,Math.round((cur-0.15)*100)/100);
  else if(a==='reset')S.bz=1;
  else if(a==='fit'){
    var br=document.querySelector('.bracket'),natw=br?+br.getAttribute('data-natw'):0;
    if(br&&natw)S.bz=Math.max(0.3,Math.min(1,Math.floor((br.clientWidth-6)/natw*100)/100));
  }
  reRender();
});
app.addEventListener('click',function(e){var b=e.target.closest('[data-h]');if(b){S.pane=b.getAttribute('data-h');renderHome()}});
app.addEventListener('click',function(e){var b=e.target.closest('[data-spocday]');if(b){S.spocDay=b.getAttribute('data-spocday');renderHome()}});
app.addEventListener('input',function(e){var t=e.target;if(t.tagName==='INPUT'&&t.hasAttribute('data-i')){var d=t.getAttribute('data-sd')||'1';SP.courts[+t.getAttribute('data-i')]['s'+d][+t.getAttribute('data-j')]=t.value}});

/* ---------- category + search ---------- */
function controls(rounds,showView){
  var courts=[];cats.forEach(function(c){c.matches.forEach(function(m){if(m.cn!==null&&courts.indexOf(m.cn)<0)courts.push(m.cn)})});courts.sort(function(a,b){return a-b});
  function opt(v,l){return '<option value="'+v+'"'+(String(S.court)===String(v)?' selected':'')+'>'+l+'</option>'}
  var h='<div class="chips" role="group" aria-label="Round"><button class="chip" data-r="" aria-pressed="'+(S.round==='')+'">All rounds</button>'+
    rounds.map(function(r){return '<button class="chip" data-r="'+esc(r)+'" aria-pressed="'+(S.round===r)+'">'+esc(r)+'</button>'}).join('')+'</div>';
  h+='<div class="row2"><div class="seg" role="group" aria-label="Day"><button data-d="" aria-pressed="'+(S.day==='')+'">All days</button><button data-d="1" aria-pressed="'+(S.day==='1')+'">Day 1</button><button data-d="2" aria-pressed="'+(S.day==='2')+'">Day 2</button></div>'+
    '<select id="fcourt" aria-label="Court"><option value="">All courts</option>'+courts.map(function(c){return opt(c,'Court '+c)}).join('')+opt('tbd','Court to be decided')+'</select>';
  if(showView)h+='<div class="seg right" role="group" aria-label="View"><button data-v="bracket" aria-pressed="'+(S.view==='bracket')+'">Bracket</button><button data-v="list" aria-pressed="'+(S.view==='list')+'">List</button></div>'+
    (S.unlocked?'<button type="button" class="btn" data-a="exportbrackettree" title="Export every category\'s draw as an Excel bracket tree, one sheet per category">⬇️ Export bracket (Excel)</button>':'');
  return h+'</div>';
}
function listHTML(sources,useQ,showCat){
  var ms=[],idx={},groups=[];
  sources.forEach(function(c){c.matches.forEach(function(m){if(pass(m,useQ))ms.push(m)})});
  ms.sort(function(a,b){return a.ci-b.ci||a.ri-b.ri||a.id-b.id});
  if(!ms.length)return '<div class="empty"><b>No matches found.</b><br>Try a shorter name, or clear the filters.<br><button class="btn" data-a="reset">Clear filters</button></div>';
  ms.forEach(function(m){var k=m.ci+'|'+m.ri;if(!(k in idx)){idx[k]=groups.length;groups.push({m:m,list:[]})}groups[idx[k]].list.push(m)});
  var h='<p class="count">'+ms.length+' match'+(ms.length===1?'':'es')+'</p><div class="legend"><span><i style="background:var(--d1)"></i>Day 1</span><span><i style="background:var(--d2)"></i>Day 2</span></div>';
  groups.forEach(function(g){
    h+='<div class="grp"><h2>'+esc(g.m.round)+'</h2>'+(showCat?'<span class="cat">'+esc(cats[g.m.ci].name)+'</span>':'')+'<span>'+g.list.length+'</span></div>'+g.list.map(function(m){return matchHTML(m,showCat)}).join('');
  });
  return h;
}
function bracketHTML(c){
  var ROW=28,W=210,GAP=26,maxr=0,minr=1e9;
  c.matches.forEach(function(m){if(m.r>maxr)maxr=m.r;if(m.r<minr)minr=m.r});var top=minr-1;
  var Hpx=(maxr-top+3)*ROW,Wpx=c.rounds.length*(W+GAP);
  var bz=S.bz||1;
  var head='<div class="bh">'+c.rounds.map(function(r){var n=c.matches.filter(function(m){return m.round===r}).length;return '<div style="width:'+((W+GAP)*bz)+'px">'+esc(r)+'<small>'+n+'</small></div>'}).join('')+'</div>';
  function cy(m){return (m.r-top)*ROW+(2*ROW-3)/2}
  function rx(m){return m.ri*(W+GAP)+GAP/2+W}
  function lx(m){return m.ri*(W+GAP)+GAP/2}
  var byCol={};
  c.matches.forEach(function(m){(byCol[m.ri]=byCol[m.ri]||[]).push(m)});
  Object.keys(byCol).forEach(function(k){byCol[k].sort(function(a,b){return a.r-b.r})});
  var paths='';
  for(var i=0;i<c.rounds.length-1;i++){
    var cur=byCol[i]||[],nxt=byCol[i+1]||[];
    if(!nxt.length)continue;
    cur.forEach(function(m){
      var best=null,bd=Infinity;
      nxt.forEach(function(n){var d=Math.abs(cy(n)-cy(m));if(d<bd){bd=d;best=n}});
      if(best){
        var x1=rx(m),y1=cy(m),x2=lx(best),y2=cy(best),midX=x1+GAP/2;
        var faded=(!pass(m,false)||!pass(best,false))?' bconn-dim':'';
        paths+='<path class="bconn'+faded+'" d="M'+x1+' '+y1+' H'+midX+' V'+y2+' H'+x2+'"/>';
      }
    });
  }
  var svg='<svg width="'+Wpx+'" height="'+Hpx+'" style="position:absolute;left:0;top:0;pointer-events:none">'+paths+'</svg>';
  var body='<div class="bb" style="height:'+Hpx+'px;width:'+Wpx+'px;transform:scale('+bz+');transform-origin:top left">'+svg+c.matches.map(function(m){
    var p=function(m,s){var x=m['e'+s];if(isEmp(x))return '<div class="p tbd">—</div>';var d=/^(\d+)\s*-\s*(.*)$/.exec(x),ri=resInfo(m,s);return '<div class="p rs'+ri.cls+'"><span class="pn">'+esc(d?d[2]:x)+'</span>'+(ri.win?'<span class="tick" title="Winner" aria-label="Winner">✓</span>':'')+ri.sc+'</div>'};
    return '<div class="bc'+(m.day==='2'?' day2':'')+(pass(m,false)?'':' dim')+(S.unlocked?' ed':'')+(S.hq&&qmatch(m,S.hq)?' hit':'')+(S.focusId===m.ci+'|'+m.id?' focus':'')+'"'+(S.unlocked?' data-edit="'+m.ci+'|'+m.id+'" role="button" tabindex="0" aria-label="Enter or edit result for match '+m.id+'"':'')+' data-k="'+m.ci+'|'+m.id+'" style="left:'+(m.ri*(W+GAP)+GAP/2)+'px;top:'+((m.r-top)*ROW)+'px;width:'+W+'px;height:'+(2*ROW-3)+'px">'+
      '<div class="mt"><span>#'+m.id+' · D'+m.day+(m.sess?' '+m.sess:'')+'</span><b>'+(m.cn===null?'Ct TBD':'Ct '+m.cn)+'</b></div>'+p(m,1)+p(m,2)+'</div>';
  }).join('')+'</div>';
  var toolbar='<div class="bztool" role="group" aria-label="Bracket zoom"><button type="button" class="bzbtn" data-bz="out" aria-label="Zoom out">−</button><span class="bzlbl">'+Math.round(bz*100)+'%</span><button type="button" class="bzbtn" data-bz="in" aria-label="Zoom in">+</button><button type="button" class="bzfit" data-bz="fit">Fit to screen</button><button type="button" class="bzfit" data-bz="reset">100%</button></div>';
  return '<div class="legend"><span><i style="background:var(--d1)"></i>Day 1</span><span><i style="background:var(--d2)"></i>Day 2</span></div><p class="bnote">Matches follow the draw sheet from left to right. Faded cards do not match your filters. Pinch, scroll, or use the zoom buttons below to see more at once.</p>'+toolbar+'<div class="bracket" tabindex="0" aria-label="'+esc(c.name)+' bracket" data-natw="'+Wpx+'">'+head+body+'</div>';
}
function champHTML(c){
  var f=c.matches.filter(function(m){return m.round==='Final'})[0];
  return f&&f.res&&f.res.w&&!isEmp(f['e'+f.res.w])?'<p class="champ">🏆 Champion: <b>'+esc(nm(f['e'+f.res.w]))+'</b></p>':'';
}
function qmatch(m,qs){var cq=compact(qs.replace(/^#/,'m')),toks=qs.toLowerCase().split(/\s+/).map(compact).filter(Boolean);return m.hay.indexOf(cq)>-1||toks.every(function(t){return m.hay.indexOf(t)>-1})}
function gotoBracket(k){
  var m=findM(k);if(!m)return;
  S.pend={k:k,q:S.q};go('#/'+cats[m.ci].slug);
}
function applyFocus(){
  if(!S.scroll)return;S.scroll=false;
  var el=document.querySelector('.bc[data-k="'+S.focusId+'"]'),br=document.querySelector('.bracket');
  if(!el||!br)return;
  br.scrollLeft=Math.max(0,el.offsetLeft-24);br.scrollTop=Math.max(0,el.offsetTop-br.clientHeight/2+30);
  window.scrollTo(0,Math.max(0,br.getBoundingClientRect().top+(window.pageYOffset||0)-70));
}
function renderCat(){
  var c=cats[cur.ci];document.title=c.name+' — SBL 2026';
  var h='<h1 class="pg">'+esc(c.name)+'</h1><p class="sub">'+c.matches.length+' matches across '+c.rounds.length+' rounds</p>'+champHTML(c)+(S.unlocked?'<div class="ohint">🔓 Organiser mode — tap a match to enter or edit its result.</div>':'')+(S.hq&&S.view==='bracket'?'<div class="ohint">Showing the bracket for your search “'+esc(S.hq)+'”. Your match is outlined in yellow; that player’s other matches are outlined in green.</div>':'')+'<div style="height:14px"></div>'+controls(c.rounds,true)+
    (S.view==='bracket'?bracketHTML(c):listHTML([c],false,false));
  app.innerHTML=h;applyFocus();
}
function renderSearch(){
  document.title='Search — SBL 2026';
  var h='<h1 class="pg">Search results</h1><p class="sub">'+(S.q?'Showing matches for “'+esc(S.q)+'” in all categories':'Type a player or team name in the search box')+'</p><div style="height:14px"></div>'+controls(ROUND_ALL,false)+
    (S.q?listHTML(cats,true,true):'<div class="empty">Start typing a name above. A first name or surname is enough.</div>');
  app.innerHTML=h;
}
app.addEventListener('click',function(e){
  var t;
  if(t=e.target.closest('[data-r]')){S.round=t.getAttribute('data-r');render()}
  else if(t=e.target.closest('[data-d]')){S.day=t.getAttribute('data-d');render()}
  else if(t=e.target.closest('[data-v]')){S.view=t.getAttribute('data-v');render()}
});
app.addEventListener('change',function(e){if(e.target.id==='fcourt'){S.court=e.target.value;render()}});

function render(){
  renderTabs();
  if(cur.p==='home')renderHome();else if(cur.p==='cat')renderCat();else renderSearch();
  renderFoot();
  find.classList.toggle('has',!!q.value);
}
var tm;
q.addEventListener('input',function(){
  clearTimeout(tm);tm=setTimeout(function(){
    S.q=q.value.trim();
    if(S.q&&cur.p!=='search'){go('#/search')}
    else if(!S.q&&cur.p==='search'){go(prevHash||'#/')}
    else render();
  },140);
  find.classList.toggle('has',!!q.value);
});
document.getElementById('clear').addEventListener('click',function(){q.value='';S.q='';find.classList.remove('has');if(cur.p==='search')go(prevHash||'#/');q.focus()});
var r0=parse();if(r0.p==='search')location.hash='#/';
cur={p:'__init'};route();
})();
</script>
